name: Build and publish release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  release:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare PDF runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor | Out-Null
          Invoke-WebRequest https://cdn.jsdelivr.net/npm/pdfjs-dist@6.5.438/build/pdf.mjs -OutFile vendor/pdf.mjs
          Invoke-WebRequest https://cdn.jsdelivr.net/npm/pdfjs-dist@6.5.438/build/pdf.worker.mjs -OutFile vendor/pdf.worker.mjs
      - name: Prepare and check OCR runtime
        shell: powershell
        run: |
          & .\INSTALLA_PADDLEOCR_BROWSER.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & .\VERIFICA_PADDLEOCR_BROWSER.ps1
          exit $LASTEXITCODE
      - name: Build installer
        shell: pwsh
        run: |
          python tools/build_installer.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item installer/LEGGIMI-INSTALLER.md outputs/LEGGIMI-INSTALLER.md
      - name: Publish versioned release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version=(Get-Content manifest.json -Raw | ConvertFrom-Json).version
          # Align older release titles too; assets and tags remain unchanged.
          $releases=gh release list --limit 1000 --json tagName,name --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($release in ($releases | ConvertFrom-Json)) {
            if ($release.name -match ' - installer pilota$') {
              $title=$release.name -replace ' - installer pilota$',''
              gh release edit "$($release.tagName)" --title "$title" --repo "$env:GITHUB_REPOSITORY"
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
            }
          }
          gh release view "v$version" --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host 'Release already exists; no asset overwritten'; exit 0 }
          gh release create "v$version" outputs/SegretarioMMG-Setup-*.exe outputs/segretario-mmg-update.zip outputs/*.sha256 outputs/LEGGIMI-INSTALLER.md --target "$env:GITHUB_SHA" --title "Segretario MMG $version" --notes-file installer/RELEASE-NOTES.md --repo "$env:GITHUB_REPOSITORY"
          exit $LASTEXITCODE
