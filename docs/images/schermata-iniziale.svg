<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="770" viewBox="0 0 1180 770" role="img" aria-label="Anteprima illustrativa della schermata iniziale di Segretario MMG">
  <rect width="1180" height="770" rx="18" fill="#f0f5f6"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="52" y="65" fill="#173a43" font-size="27" font-weight="700">Scegli come lavorare.</text>
    <text x="52" y="100" fill="#526b73" font-size="17">Un punto di partenza per ogni attività.</text>
    <rect x="53" y="145" width="38" height="38" rx="12" fill="#d8ece8"/>
    <text x="66" y="171" fill="#17665e" font-size="20" font-weight="700">1</text>
    <text x="107" y="171" fill="#214852" font-size="20" font-weight="700">Scegli il modello IA</text>
    <text x="107" y="204" fill="#526b73" font-size="16">La preferenza viene ricordata.</text>
    <text x="107" y="229" fill="#526b73" font-size="16">Per le foto serve il supporto immagini.</text>
    <rect x="53" y="283" width="38" height="38" rx="12" fill="#d8ece8"/>
    <text x="66" y="309" fill="#17665e" font-size="20" font-weight="700">2</text>
    <text x="107" y="309" fill="#214852" font-size="20" font-weight="700">Scegli l’attività</text>
    <text x="107" y="342" fill="#526b73" font-size="16">Risultati già prescritti, nuovi referti</text>
    <text x="107" y="367" fill="#526b73" font-size="16">oppure una lista di esami da prescrivere.</text>
    <rect x="53" y="421" width="38" height="38" rx="12" fill="#d8ece8"/>
    <text x="66" y="447" fill="#17665e" font-size="20" font-weight="700">3</text>
    <text x="107" y="447" fill="#214852" font-size="20" font-weight="700">Carica e controlla</text>
    <text x="107" y="480" fill="#526b73" font-size="16">PDF, foto o testo incollato.</text>
    <text x="107" y="505" fill="#526b73" font-size="16">Verifica l’anteprima e le voci segnalate.</text>
    <rect x="52" y="563" width="427" height="88" rx="12" fill="#e1ecef"/>
    <text x="71" y="595" fill="#365963" font-size="15" font-weight="700">Durante l’inserimento</text>
    <text x="71" y="623" fill="#526b73" font-size="15">Tieni Eumed in primo piano.</text>
    <text x="53" y="716" fill="#71878e" font-size="13">ILLUSTRAZIONE DELL’INTERFACCIA · NESSUN DATO REALE</text>
  </g>
  <rect x="558" y="46" width="566" height="655" rx="13" fill="#dce5e7"/>
  <rect x="551" y="39" width="566" height="655" rx="13" fill="white" stroke="#c2ced1"/>
  <path d="M564 39h540q13 0 13 13v65H551V52q0-13 13-13" fill="#30343b"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="574" y="72" fill="white" font-size="19" font-weight="700">SEGRETARIO MMG</text>
    <text x="574" y="96" fill="#d8dde1" font-size="12">Referti e liste di esami · elaborazione sul computer</text>
    <text x="1080" y="77" fill="white" font-size="25">×</text>
    <text x="575" y="151" fill="#222" font-size="19" font-weight="700">Cosa vuoi fare?</text>
    <text x="575" y="179" fill="#666" font-size="13">Apri in Eumed la sezione in cui vuoi lavorare,</text>
    <text x="575" y="199" fill="#666" font-size="13">poi scegli un’attività.</text>
    <rect x="575" y="220" width="518" height="160" rx="6" fill="#f3f4f5"/>
    <text x="590" y="247" fill="#222" font-size="15" font-weight="700">Modello IA</text>
    <rect x="590" y="259" width="330" height="39" rx="3" fill="white" stroke="#aeb4ba"/>
    <text x="602" y="284" fill="#30343b" font-size="14">qwen3.5:4b</text>
    <text x="898" y="282" fill="#57636b" font-size="13">▾</text>
    <rect x="928" y="259" width="150" height="39" rx="4" fill="white" stroke="#aeb4ba"/>
    <text x="940" y="284" fill="#30343b" font-size="13">Aggiorna elenco</text>
    <text x="590" y="324" fill="#666" font-size="12">Legge testo e immagini.</text>
    <text x="590" y="348" fill="#666" font-size="12">La scelta vale per tutte le modalità e viene ricordata</text>
    <text x="590" y="366" fill="#666" font-size="12">in questo profilo Chrome.</text>
    <rect x="575" y="396" width="518" height="82" rx="7" fill="#f5f6f7" stroke="#aeb4ba"/>
    <text x="591" y="423" fill="#222" font-size="14" font-weight="700">REFERTO GIÀ PRESCRITTO</text>
    <text x="591" y="451" fill="#555" font-size="12">Compila gli esami già presenti nella tabella Eumed.</text>
    <rect x="575" y="490" width="518" height="82" rx="7" fill="#f5f6f7" stroke="#aeb4ba"/>
    <text x="591" y="517" fill="#222" font-size="14" font-weight="700">REFERTO NON PRESCRITTO</text>
    <text x="591" y="545" fill="#555" font-size="12">Crea una riga per ogni esame riconosciuto nel catalogo.</text>
    <rect x="575" y="584" width="518" height="82" rx="7" fill="#f5f6f7" stroke="#aeb4ba"/>
    <text x="591" y="611" fill="#222" font-size="14" font-weight="700">PRESCRIVI ESAMI DA LISTA</text>
    <text x="591" y="637" fill="#555" font-size="12">Incolla una lista oppure carica PDF, JPEG o PNG.</text>
    <text x="591" y="654" fill="#555" font-size="12">Le liste con X e spunte vengono lette dall’IA.</text>
  </g>
</svg>
